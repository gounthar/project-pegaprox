---
name: riscv64 compatibility test

# Smoke-test that all pip deps install on a native riscv64 runner,
# then verify the application can be imported without errors.

on:
  push:
    branches: [feat/riscv64-support]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  pip-install:
    name: pip install on riscv64
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@v4

      - name: Discover Python and install build deps
        run: |
          PYTHON=$(command -v python3.12 \
            || command -v python3 \
            || find /opt -name 'python3.12' 2>/dev/null | head -1)
          echo "Using Python: $PYTHON"
          $PYTHON --version
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"

          # python3-dev is required by cffi and other C-extension packages.
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-dev \
            build-essential libffi-dev libssl-dev \
            curl ca-certificates

      - name: Install Rust via rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Create virtualenv and install dependencies
        env:
          # maturin maps Python's riscv64-linux-gnu SOABI to the wrong triple;
          # override to the correct rustup target name.
          CARGO_BUILD_TARGET: riscv64gc-unknown-linux-gnu
        run: |
          $PYTHON -m venv /tmp/pegaprox-venv
          /tmp/pegaprox-venv/bin/pip install \
            --no-cache-dir -r requirements.txt

      - name: Smoke-test imports
        run: |
          /tmp/pegaprox-venv/bin/python3 - <<'EOF'
          import flask
          import cryptography
          import paramiko
          import gevent
          import jwt
          import ldap3
          import pyotp
          import qrcode
          print("All core imports successful")
          EOF

  docker-build:
    name: Docker build on riscv64
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/riscv64
          push: false
          tags: pegaprox:riscv64-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
