---
name: riscv64 compatibility test

# Smoke-test that all pip deps install on a native riscv64 runner,
# then verify the application can be imported without errors.

on:
  push:
    branches: [feat/riscv64-support]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  pip-install:
    name: pip install on riscv64
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@v4

      - name: Discover Python and install build deps
        run: |
          # Find the available Python 3 interpreter
          PYTHON=$(command -v python3.12 \
            || command -v python3 \
            || find /opt -name 'python3.12' 2>/dev/null | head -1)
          echo "Using Python: $PYTHON"
          $PYTHON --version
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"

          # Build deps for packages without riscv64 wheels (e.g. cryptography)
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cargo rustc gcc libffi-dev libssl-dev

      - name: Create virtualenv and install dependencies
        run: |
          $PYTHON -m venv /tmp/pegaprox-venv
          /tmp/pegaprox-venv/bin/pip install \
            --no-cache-dir -r requirements.txt

      - name: Smoke-test imports
        run: |
          /tmp/pegaprox-venv/bin/python3 - <<'EOF'
          import flask
          import cryptography
          import paramiko
          import gevent
          import jwt
          import ldap3
          import pyotp
          import qrcode
          print("All core imports successful")
          EOF

  docker-build:
    name: Docker build on riscv64
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/riscv64
          push: false
          tags: pegaprox:riscv64-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
